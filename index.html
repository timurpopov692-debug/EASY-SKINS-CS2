            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                if (tg.CloudStorage) {
                    tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                }
                document.getElementById('saveStatus').textContent = '✅ Сохранено';
            } catch (e) {}
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    balance = data.balance || 1000;
                    inventory = data.inventory || [];
                    updateUI();
                    document.getElementById('saveStatus').textContent = '💾 Загружено для ID ' + userId;
                    return;
                }
            } catch (e) {}

            if (tg.CloudStorage) {
                tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
                    if (!err && value) {
                        try {
                            const data = JSON.parse(value);
                            balance = data.balance || 1000;
                            inventory = data.inventory || [];
                            updateUI();
                            document.getElementById('saveStatus').textContent = '☁️ Загружено из облака для ID ' + userId;
                            return;
                        } catch (e) {}
                    }
                    document.getElementById('saveStatus').textContent = '👤 Новый пользователь! ID: ' + userId;
                    saveData();
                });
            }
        }

        function updateUI() {
            document.getElementById('balance').textContent = balance;
            renderInventory();
        }

        // ============================================================
        //  НАВИГАЦИЯ
        // ============================================================

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + (page === 'cases' ? 'Cases' : 'Inventory')).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(page === 'cases' ? 'btnCases' : 'btnInv').classList.add('active');
            if (page === 'inventory') renderInventory();
        }

        // ============================================================
        //  КЕЙСЫ
        // ============================================================

        function renderCases() {
            const grid = document.getElementById('caseGrid');
            grid.innerHTML = '';
            cases.forEach((c, i) => {
                const btn = document.createElement('div');
                btn.className = 'case-btn';
                btn.innerHTML = `
                    <div class="name">${c.name}</div>
                    <div class="price">${c.price} 💰</div>
                    <div class="rarity"><div class="fill" style="width:${Math.random()*60+20}%"></div></div>
                `;
                btn.onclick = () => openCase(i);
                grid.appendChild(btn);
            });
        }

        function openCase(index) {
            if (isSpinning) return;
            const caseData = cases[index];
            if (balance < caseData.price) {
                tg.showAlert(`❌ Не хватает ${caseData.price} монет!`);
                return;
            }

            balance -= caseData.price;
            updateUI();
            saveData();

            document.getElementById('caseGrid').style.display = 'none';
            document.getElementById('rouletteContainer').style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('rouletteResult').style.display = 'none';

            startRoulette(caseData.items);
        }

        // ============================================================
        //  РУЛЕТКА (ИСПРАВЛЕННАЯ)
        // ============================================================

        function startRoulette(itemsList) {
            isSpinning = true;

            // Выбираем предмет
            const totalWeight = itemsList.reduce((sum, i) => sum + i.weight, 0);
            let rand = Math.random() * totalWeight;
            let dropped = itemsList[0];
            for (let item of itemsList) {
                rand -= item.weight;
                if (rand <= 0) { dropped = item; break; }
            }

            // Создаём список для прокрутки (40 предметов для плавности)
            const spinItems = [];
            for (let i = 0; i < 40; i++) {
                const r = itemsList[Math.floor(Math.random() * itemsList.length)];
                spinItems.push(r);
            }
            // В КОНЕЦ — ВЫИГРЫШ
            spinItems.push(dropped);

            const container = document.getElementById('rouletteItems');
            container.innerHTML = '';
            spinItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'roulette-item';
                div.innerHTML = `
                    <div style="font-size:32px;margin-bottom:4px;">${getIcon(item.quality)}</div>
                    <div class="rname">${item.name}</div>
                    <div class="rprice">${item.value}</div>
                `;
                container.appendChild(div);
            });

            // Анимация с увеличенной длиной
            const itemWidth = 140;
            const totalDistance = spinItems.length * itemWidth;
            // Останавливаем так, чтобы выигрыш был ровно под указателем
            const targetPos = -(spinItems.length - 1) * itemWidth + (itemWidth / 2);
            
            let startTime = Date.now();
            const duration = 3500; // чуть дольше для красоты

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // easeOutQuart — очень плавное замедление
                const eased = 1 - Math.pow(1 - progress, 4);
                const pos = eased * targetPos;
                container.style.transform = `translateX(${pos}px)`;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    showResult(dropped);
                }
            }
            animate();
        }

        function showResult(item) {
            const resultDiv = document.getElementById('rouletteResult');
            resultDiv.style.display = 'block';
            document.getElementById('rItem').textContent = `${getIcon(item.quality)} ${item.name}`;
            document.getElementById('rQuality').textContent = item.quality.toUpperCase();
            document.getElementById('rQuality').style.color = getQualityColor(item.quality);
            document.getElementById('rValue').textContent = `💰 ${item.value} монет`;

            // Добавляем в инвентарь (НЕ ПРОДАЁМ АВТОМАТИЧЕСКИ!)
            inventory.push({ ...item });
            // Баланс НЕ меняется (скин добавляется в инвентарь, а не продаётся)
            // balance += item.value;  ← ЭТО УБРАНО!
            updateUI();
            saveData();
            isSpinning = false;
        }

        function getIcon(quality) {
            const icons = {
                consumer: '⬜',
                industrial: '🟦',
                'mil-spec': '🟩',
                restricted: '🟪',
                classified: '🟥',
                covert: '⭐'
            };
            return icons[quality] || '⬜';
        }

        function getQualityColor(q) {
            const colors = {
                consumer: '#8a8a8a',
                industrial: '#5b8cdf',
                'mil-spec': '#4caf50',
                restricted: '#9b59b6',
                classified: '#e74c3c',
                covert: '#f1c40f'
            };
            return colors[q] || '#fff';
        }

        function backToCases() {
            if (isSpinning) return;
            document.getElementById('rouletteContainer').style.display = 'none';
            document.getElementById('rouletteResult').style.display = 'none';
            document.getElementById('caseGrid').style.display = 'grid';
            document.getElementById('backBtn').style.display = 'none';
        }

        // ============================================================
        //  ИНВЕНТАРЬ И ПРОДАЖА (КОМИССИЯ 10%)
        // ============================================================

        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            if (!inventory || inventory.length === 0) {
                grid.innerHTML = '<div class="inv-empty">🎒 Инвентарь пуст</div>';
                return;
            }
            grid.innerHTML = '';
            inventory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `inv-item quality-${item.quality}`;
                const sellPrice = Math.floor(item.value * 0.9); // 10% комиссия
                div.innerHTML = `
                    <div style="font-size:36px;">${getIcon(item.quality)}</div>
                    <div class="iname">${item.name}</div>
                    <div class="iprice">💰 ${item.value}</div>
                    <div class="iq" style="color:${getQualityColor(item.quality)}">${item.quality}</div>
                    <button class="sell-btn" onclick="sellItem(${index})">💰 Продать за ${sellPrice}</button>
                `;
                grid.appendChild(div);
            });
        }

        function sellItem(index) {
            const item = inventory[index];
            if (!item) return;
            const price = Math.floor(item.value * 0.9); // 10% комиссия

            if (tg.showPopup) {
                tg.showPopup({
                    title: '💸 Продажа',
                    message: `Продать "${item.name}" за ${price} монет?`,
                    buttons: [
                        { id: 'sell', text: '💰 Продать', type: 'default' },
                        { id: 'cancel', text: '❌ Отмена', type: 'destructive' }
                    ]
                }, (btnId) => {
                    if (btnId === 'sell') {
                        inventory.splice(index, 1);
                        balance += price;
                        updateUI();
                        saveData();
                        tg.showAlert(`✅ "${item.name}" продан за ${price} монет!`);
                    }
                });
            } else {
                if (confirm(`Продать "${item.name}" за ${price} монет?`)) {
                    inventory.splice(index, 1);
                    balance += price;
                    updateUI();
                    saveData();
                }
            }
        }

        // ============================================================
        //  ЗАПУСК
        // ============================================================

        renderCases();
        loadData();
        updateUI();

        setInterval(saveData, 60000);
    </script>
</body>
</html>
