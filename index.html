<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY SKINS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 16px;
            width: 100%;
        }
        .header h1 {
            color: #f5a623;
            font-size: 28px;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(245, 166, 35, 0.3);
            letter-spacing: 2px;
        }
        .header .sub {
            color: #888;
            font-size: 11px;
            margin-top: 2px;
            letter-spacing: 3px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 16px;
            gap: 10px;
        }
        .balance {
            font-size: 18px;
            background: #1a1a2e;
            padding: 10px 20px;
            border-radius: 14px;
            border: 1px solid #f5a623;
            flex: 1;
            text-align: center;
        }
        .balance span {
            color: #f5a623;
            font-weight: bold;
        }
        .nav-btn {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            color: white;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .nav-btn:active {
            transform: scale(0.94);
            border-color: #f5a623;
        }
        .nav-btn.active {
            border-color: #f5a623;
            background: #2a1a0a;
        }

        /* ========== СТРАНИЦА КЕЙСОВ ========== */
        .page {
            display: none;
            width: 100%;
            max-width: 400px;
            flex-direction: column;
            align-items: center;
        }
        .page.active {
            display: flex;
        }
        .case-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }
        .case-btn {
            background: #1a1a2e;
            border: 2px solid #2a2a4a;
            border-radius: 14px;
            padding: 16px 10px;
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }
        .case-btn:active {
            transform: scale(0.94);
            border-color: #f5a623;
        }
        .case-btn .name {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 3px;
        }
        .case-btn .price {
            color: #f5a623;
            font-size: 12px;
            font-weight: 600;
        }

        /* ========== РУЛЕТКА ========== */
        .roulette-container {
            width: 100%;
            max-width: 400px;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a2a4a;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .roulette-track {
            position: relative;
            height: 70px;
            overflow: hidden;
            border-radius: 12px;
            background: #0d0d1a;
            border: 1px solid #2a2a4a;
        }
        .roulette-items {
            display: flex;
            transition: transform 0.1s linear;
            will-change: transform;
            height: 100%;
            align-items: center;
        }
        .roulette-item {
            min-width: 100px;
            padding: 8px 12px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            border-right: 1px solid #2a2a4a;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .roulette-item .icon {
            font-size: 28px;
            margin-bottom: 2px;
        }
        .roulette-item .rname {
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90px;
        }
        .roulette-item .rprice {
            font-size: 10px;
            color: #f5a623;
        }
        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            width: 3px;
            height: 100%;
            background: #f5a623;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 20px rgba(245, 166, 35, 0.5);
        }
        .roulette-pointer::after {
            content: '▼';
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            color: #f5a623;
            font-size: 16px;
        }
        .roulette-result {
            margin-top: 16px;
            text-align: center;
            padding: 12px;
            background: #0d0d1a;
            border-radius: 12px;
            min-height: 50px;
            display: none;
        }
        .roulette-result .ritem {
            font-size: 18px;
            font-weight: bold;
        }
        .roulette-result .rquality {
            font-size: 13px;
        }
        .roulette-result .rvalue {
            color: #f5a623;
            font-size: 15px;
        }

        /* ========== ИНВЕНТАРЬ ========== */
        .inventory-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .inv-item {
            background: #1a1a2e;
            border: 2px solid #2a2a4a;
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            transition: 0.15s;
            position: relative;
        }
        .inv-item .icon {
            font-size: 32px;
        }
        .inv-item .iname {
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .inv-item .iprice {
            font-size: 11px;
            color: #f5a623;
        }
        .inv-item .iq {
            font-size: 9px;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .inv-item .sell-btn {
            margin-top: 6px;
            background: #2a2a4a;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
        }
        .inv-item .sell-btn:active {
            transform: scale(0.94);
            background: #3a3a5a;
        }
        .inv-empty {
            text-align: center;
            color: #666;
            padding: 40px 0;
            font-size: 16px;
            width: 100%;
        }
        .quality-consumer {
            border-color: #8a8a8a !important;
        }
        .quality-industrial {
            border-color: #5b8cdf !important;
        }
        .quality-mil-spec {
            border-color: #4caf50 !important;
        }
        .quality-restricted {
            border-color: #9b59b6 !important;
        }
        .quality-classified {
            border-color: #e74c3c !important;
        }
        .quality-covert {
            border-color: #f1c40f !important;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.2);
        }

        /* ========== ОБЩЕЕ ========== */
        .back-btn {
            margin-top: 16px;
            background: #2a2a4a;
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
            max-width: 400px;
        }
        .back-btn:active {
            transform: scale(0.96);
            background: #3a3a5a;
        }
        .footer {
            margin-top: 20px;
            color: #333;
            font-size: 10px;
            letter-spacing: 1px;
        }
        .save-status {
            color: #4caf50;
            font-size: 10px;
            margin-top: 8px;
            opacity: 0.7;
        }

        /* Анимация для рулетки */
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .spinning {
            animation: pulse 0.3s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div class="footer">EASY SKINS © 2026</div>

    <script>

        // ============================================================

        const cases = [

        // Все предметы с иконками
        const allItems = [

            { name: "Five-SeveN | Берёза", quality: "consumer", value: 38, icon: "🔫", weight: 9 },

            { name: "AWP | Паучья сетка", quality: "consumer", value: 250, icon: "🎯", weight: 9 },

            { name: "MAG-7 | Светлячок", quality: "industrial", value: 65, icon: "🔫", weight: 7 },
            { name: "Nova | Гипербит", quality: "industrial", value: 70, icon: "🔫", weight: 7 },
            { name: "Glock-18 | Канна", quality: "industrial", value: 80, icon: "🔫", weight: 7 },
            { name: "USP-S | Бизон", quality: "industrial", value: 85, icon: "🔫", weight: 7 },
            { name: "Desert Eagle | Светлячок", quality: "industrial", value: 90, icon: "🔫", weight: 7 },
            { name: "AK-47 | Голубая плитка", quality: "industrial", value: 140, icon: "🔫", weight: 7 },
            { name: "M4A1-S | Кибербезопасность", quality: "industrial", value: 160, icon: "🔫", weight: 7 },
            { name: "AWP | Канна", quality: "industrial", value: 550, icon: "🎯", weight: 7 },
            { name: "AWP | Дракон", quality: "industrial", value: 580, icon: "🎯", weight: 7 },
            { name: "MAG-7 | Фараон", quality: "mil-spec", value: 180, icon: "🔫", weight: 5 },
            { name: "Nova | Канна", quality: "mil-spec", value: 190, icon: "🔫", weight: 5 },
            { name: "XM1014 | Огонь и лёд", quality: "mil-spec", value: 200, icon: "🔫", weight: 5 },
            { name: "Glock-18 | Огонь и лёд", quality: "mil-spec", value: 320, icon: "🔫", weight: 5 },
            { name: "USP-S | Дракон", quality: "mil-spec", value: 340, icon: "🔫", weight: 5 },
            { name: "Desert Eagle | Гипербит", quality: "mil-spec", value: 360, icon: "🔫", weight: 5 },
            { name: "AUG | Фараон", quality: "mil-spec", value: 480, icon: "🔫", weight: 5 },
            { name: "AWP | Огонь и лёд", quality: "mil-spec", value: 1200, icon: "🎯", weight: 5 },
            { name: "MAG-7 | Золотой дракон", quality: "restricted", value: 450, icon: "🔫", weight: 4 },
            { name: "Five-SeveN | Золотой дракон", quality: "restricted", value: 700, icon: "🔫", weight: 4 },
            { name: "Glock-18 | Супер-легенда", quality: "restricted", value: 750, icon: "🔫", weight: 4 },
            { name: "M4A4 | Золотой дракон", quality: "restricted", value: 1100, icon: "🔫", weight: 4 },
            { name: "AK-47 | Супер-легенда", quality: "restricted", value: 1150, icon: "🔫", weight: 4 },
            { name: "AWP | Император", quality: "restricted", value: 2800, icon: "🎯", weight: 4 },
            { name: "XM1014 | Император", quality: "classified", value: 800, icon: "🔫", weight: 3 },
            { name: "USP-S | Император", quality: "classified", value: 1300, icon: "🔫", weight: 3 },
            { name: "AWP | Бесконечность", quality: "classified", value: 5000, icon: "🎯", weight: 3 },
            { name: "M4A4 | Легенда", quality: "classified", value: 8000, icon: "🔫", weight: 3 },
            { name: "MAG-7 | Космос", quality: "covert", value: 1600, icon: "⭐", weight: 1 },
            { name: "Desert Eagle | Космос", quality: "covert", value: 2800, icon: "⭐", weight: 1 },
            { name: "M4A1-S | Космос", quality: "covert", value: 4800, icon: "⭐", weight: 1 },
            { name: "AWP | Звёздный", quality: "covert", value: 9000, icon: "⭐", weight: 1 }
        ];

        // ============================================================
        //  СОСТОЯНИЕ
        // ============================================================

        let balance = 1000;
        let inventory = [];
        let currentCaseIndex = -1;
        let isSpinning = false;
        const STORAGE_KEY = 'easy_skins_data';

        // ============================================================
        //  СОХРАНЕНИЕ / ЗАГРУЗКА
        // ============================================================

        function saveData() {
            const data = {
                balance: balance,
                inventory: inventory,
                timestamp: Date.now()
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                document.getElementById('saveStatus').textContent = '✅ Сохранено';
                document.getElementById('saveStatus').style.color = '#4caf50';
            } catch (e) {
                console.log('Ошибка сохранения:', e);
            }
            // Пробуем сохранить в CloudStorage
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify(data), (err) => {
                    if (err) console.log('CloudStorage error:', err);
                });
            }
        }

        function loadData() {
            // Сначала пробуем CloudStorage
            if (tg.CloudStorage) {
                tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
                    if (!err && value) {
                        try {
                            const data = JSON.parse(value);
                            balance = data.balance || 1000;
                            inventory = data.inventory || [];
                            updateUI();
                            document.getElementById('saveStatus').textContent = '✅ Загружено из облака';
                            return;
                        } catch (e) {}
                    }
                    // Если CloudStorage не помог — пробуем localStorage
                    loadLocal();
                });
            } else {
                loadLocal();
            }
        }

        function loadLocal() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    balance = data.balance || 1000;
                    inventory = data.inventory || [];
                    updateUI();
                    document.getElementById('saveStatus').textContent = '💾 Загружено из кэша';
                }
            } catch (e) {
                console.log('Ошибка загрузки:', e);
            }
        }

        // ============================================================
        //  UI
        // ============================================================

        function updateUI() {
            document.getElementById('balance').textContent = balance;
            renderInventory();
        }

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1)).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (page === 'cases') {
                document.getElementById('btnCases').classList.add('active');
            } else {
                document.getElementById('btnInv').classList.add('active');
                renderInventory();
            }
        }

        // ============================================================
        //  КЕЙСЫ
        // ============================================================

        function renderCases() {
            const grid = document.getElementById('caseGrid');
            grid.innerHTML = '';
            cases.forEach((c, i) => {
                const btn = document.createElement('div');
                btn.className = 'case-btn';
                btn.innerHTML = `<div class="name">${c.name}</div><div class="price">${c.price} 💰</div>`;
                btn.onclick = () => startCase(i);
                grid.appendChild(btn);
            });
        }

        function startCase(index) {
            if (isSpinning) return;
            const caseData = cases[index];
            if (balance < caseData.price) {
                tg.showAlert(`❌ Не хватает ${caseData.price} монет!`);
                return;
            }

            currentCaseIndex = index;
            balance -= caseData.price;
            updateUI();
            saveData();

            // Показываем рулетку
            document.getElementById('caseGrid').style.display = 'none';
            document.getElementById('rouletteContainer').style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('rouletteResult').style.display = 'none';

            // Запускаем рулетку
            spinRoulette(caseData.price);
        }

        // ============================================================
        //  РУЛЕТКА
        // ============================================================

        function spinRoulette(casePrice) {
            isSpinning = true;

            // Выбираем предмет с учётом весов
            const totalWeight = allItems.reduce((sum, item) => sum + item.weight, 0);
            let rand = Math.random() * totalWeight;
            let dropped = allItems[0];
            for (let item of allItems) {
                rand -= item.weight;
                if (rand <= 0) { dropped = item; break; }
            }

            // Генерируем 30 предметов для прокрутки (чтобы создать эффект рулетки)
            const spinItems = [];
            for (let i = 0; i < 30; i++) {
                const randomIdx = Math.floor(Math.random() * allItems.length);
                spinItems.push(allItems[randomIdx]);
            }
            // В конец ставим выигранный предмет
            spinItems.push(dropped);

            const container = document.getElementById('rouletteItems');
            container.innerHTML = '';
            spinItems.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'roulette-item';
                const isWin = (idx === spinItems.length - 1);
                div.innerHTML = `
                    <div class="icon">${item.icon}</div>
                    <div class="rname">${item.name}</div>
                    <div class="rprice">${isWin ? '⭐ ВЫИГРЫШ!' : item.value}</div>
                `;
                if (isWin) {
                    div.style.border = '2px solid #f5a623';
                    div.style.borderRadius = '8px';
                    div.style.background = '#2a1a0a';
                }
                container.appendChild(div);
            });

            // Позиционируем так, чтобы выигрыш оказался под указателем
            const itemWidth = 100;
            const targetOffset = -(spinItems.length - 1) * itemWidth + 50;
            container.style.transform = `translateX(${targetOffset}px)`;

            // Анимация — прокрутка с ускорением и замедлением
            let currentPos = 0;
            const totalDistance = spinItems.length * itemWidth;
            let startTime = Date.now();
            const duration = 3000; // 3 секунды

            function animateRoulette() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // easeOutCubic — замедление в конце
                const eased = 1 - Math.pow(1 - progress, 3);
                const pos = -eased * totalDistance + 50;

                container.style.transform = `translateX(${pos}px)`;

                if (progress < 1) {
                    requestAnimationFrame(animateRoulette);
                } else {
                    // Завершение
                    const resultDiv = document.getElementById('rouletteResult');
                    resultDiv.style.display = 'block';
                    document.getElementById('rItem').textContent = `${dropped.icon} ${dropped.name}`;
                    document.getElementById('rQuality').textContent = dropped.quality.toUpperCase();
                    document.getElementById('rQuality').style.color = getQualityColor(dropped.quality);
                    document.getElementById('rValue').textContent = `💰 ${dropped.value} монет`;

                    // Добавляем в инвентарь
                    inventory.push({ ...dropped });
                    balance += dropped.value;
                    updateUI();
                    saveData();
                    isSpinning = false;
                }
            }

            animateRoulette();
        }

        function getQualityColor(q) {
            const colors = {
                consumer: '#8a8a8a',
                industrial: '#5b8cdf',
                'mil-spec': '#4caf50',
                restricted: '#9b59b6',
                classified: '#e74c3c',
                covert: '#f1c40f'
            };
            return colors[q] || '#fff';
        }

        function backToCases() {
            document.getElementById('rouletteContainer').style.display = 'none';
            document.getElementById('rouletteResult').style.display = 'none';
            document.getElementById('caseGrid').style.display = 'grid';
            document.getElementById('backBtn').style.display = 'none';
            isSpinning = false;
        }

        // ============================================================
        //  ИНВЕНТАРЬ
        // ============================================================

        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            if (!inventory || inventory.length === 0) {
                grid.innerHTML = '<div class="inv-empty">🎒 Инвентарь пуст</div>';
                return;
            }

            grid.innerHTML = '';
            inventory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `inv-item quality-${item.quality}`;
                div.innerHTML = `
                    <div class="icon">${item.icon || '🔫'}</div>
                    <div class="iname">${item.name}</div>
                    <div class="iprice">💰 ${item.value}</div>
                    <div class="iq" style="color:${getQualityColor(item.quality)}">${item.quality}</div>
                    <button class="sell-btn" onclick="sellItem(${index})">💰 Продать</button>
                `;
                grid.appendChild(div);
            });
        }

        function sellItem(index) {
            const item = inventory[index];
            if (!item) return;
            const price = Math.floor(item.value * 0.7);
            tg.showAlert(`Продать ${item.name} за ${price} монет?`, [{
                text: 'Продать',
                callback: () => {
                    inventory.splice(index, 1);
                    balance += price;
                    updateUI();
                    saveData();
                    renderInventory();
                    tg.showAlert(`✅ Продано за ${price} монет!`);
                }
            }, {
                text: 'Отмена'
            }]);
        }

        // ============================================================
        //  ЗАПУСК
        // ============================================================

        renderCases();
        loadData();
        updateUI();

        // Сохраняем при закрытии
        tg.onEvent('viewportChanged', saveData);
        setInterval(saveData, 30000);
    </script>
</body>
</html>
