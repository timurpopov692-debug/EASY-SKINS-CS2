<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Кейсы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #f5a623;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .balance {
            font-size: 20px;
            background: #16213e;
            padding: 10px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #f5a623;
        }
        .case-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }
        .case-btn {
            background: #16213e;
            border: 2px solid #2a3a6e;
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .case-btn:active {
            transform: scale(0.95);
        }
        .case-btn .name {
            font-weight: bold;
            font-size: 16px;
        }
        .case-btn .price {
            color: #f5a623;
            font-size: 13px;
        }
        .result {
            margin-top: 20px;
            background: #16213e;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #2a3a6e;
            min-height: 60px;
            display: none;
        }
        .result .item {
            font-size: 22px;
            font-weight: bold;
        }
        .result .quality {
            font-size: 14px;
            margin-top: 5px;
        }
        .result .value {
            color: #f5a623;
            font-size: 16px;
            margin-top: 5px;
        }
        .quality-consumer { color: #8a8a8a; }
        .quality-industrial { color: #5b8cdf; }
        .quality-mil-spec { color: #4caf50; }
        .quality-restricted { color: #9b59b6; }
        .quality-classified { color: #e74c3c; }
        .quality-covert { color: #f1c40f; }
    </style>
</head>
<body>
    <h1>🔫 CS2 Кейсы</h1>
    <div class="balance">💰 Баланс: <span id="balance">0</span> монет</div>
    
    <div class="case-grid" id="caseGrid">
        <!-- Кейсы будут вставлены из JS -->
    </div>
    
    <div class="result" id="result">
        <div class="item" id="resultItem">-</div>
        <div class="quality" id="resultQuality">-</div>
        <div class="value" id="resultValue">-</div>
    </div>

    <script>
        // Инициализация Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Растягиваем на весь экран

        // Данные кейсов (синхронизированы с ботом)
        const cases = [
            { name: "🔫 Дробовики", price: 300 },
            { name: "🔫 Пистолеты", price: 500 },
            { name: "🔫 Винтовки", price: 800 },
            { name: "🔫 AWP-кейс", price: 1200 },
            { name: "🔫 AK-47 кейс", price: 1500 },
            { name: "🔫 M4-кейс", price: 1500 },
            { name: "🔪 Ножи", price: 3000 },
            { name: "💎 Премиум", price: 5000 }
        ];

        let userId = tg.initDataUnsafe?.user?.id || 0;
        let balance = 1000;

        // Получаем баланс от бота (через WebApp)
        // В реальном приложении тут будет запрос к твоему боту
        // Пока просто показываем стартовый баланс

        // Рендерим кейсы
        function renderCases() {
            const grid = document.getElementById('caseGrid');
            grid.innerHTML = '';
            cases.forEach((c, i) => {
                const btn = document.createElement('div');
                btn.className = 'case-btn';
                btn.innerHTML = `
                    <div class="name">${c.name}</div>
                    <div class="price">${c.price} 💰</div>
                `;
                btn.onclick = () => openCase(i);
                grid.appendChild(btn);
            });
        }

        // Открытие кейса
        function openCase(index) {
            const caseData = cases[index];
            if (balance < caseData.price) {
                tg.showAlert(`❌ Не хватает ${caseData.price} монет!`);
                return;
            }

            balance -= caseData.price;
            updateBalance();

            // Показываем анимацию открытия
            const resultDiv = document.getElementById('result');
            const itemEl = document.getElementById('resultItem');
            const qualityEl = document.getElementById('resultQuality');
            const valueEl = document.getElementById('resultValue');
            
            resultDiv.style.display = 'block';
            itemEl.textContent = '⏳ Открывается...';
            qualityEl.textContent = '';
            valueEl.textContent = '';

            // Имитация задержки (в реальности бот пришлёт результат)
            setTimeout(() => {
                // Симуляция дропа (в реальности — ответ от бота)
                const items = [
                    { name: "🗑️ Мусор", quality: "consumer", value: 20 },
                    { name: "🔦 Фонарик", quality: "industrial", value: 100 },
                    { name: "⚔️ Меч", quality: "mil-spec", value: 300 },
                    { name: "💎 Алмаз", quality: "restricted", value: 800 },
                    { name: "👑 Корона", quality: "classified", value: 2000 },
                    { name: "⭐ Легенда", quality: "covert", value: 5000 }
                ];
                const dropped = items[Math.floor(Math.random() * items.length)];
                
                itemEl.textContent = dropped.name;
                qualityEl.textContent = `Качество: ${dropped.quality}`;
                qualityEl.className = `quality quality-${dropped.quality}`;
                valueEl.textContent = `💰 ${dropped.value} монет`;
                
                balance += dropped.value;
                updateBalance();
                
                // Отправляем результат боту (если нужно сохранить в инвентарь)
                tg.sendData(JSON.stringify({
                    action: 'case_opened',
                    item: dropped.name,
                    value: dropped.value,
                    quality: dropped.quality
                }));
            }, 1500);
        }

        function updateBalance() {
            document.getElementById('balance').textContent = balance;
        }

        // Запуск
        renderCases();
        updateBalance();

        // Закрытие Mini App
        tg.onEvent('mainButtonClicked', function() {
            tg.close();
        });
    </script>
</body>
  </html>
