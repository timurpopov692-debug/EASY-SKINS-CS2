            font-weight: 600;

        }

            border-radius: 16px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .case-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(245, 166, 35, 0.05), transparent);
            opacity: 0;
            transition: 0.3s;
        }

        .case-btn:active {
            transform: scale(0.94);
            border-color: #f5a623;
        }

        .case-btn:active::before {
            opacity: 1;
        }

        .case-btn .name {

            font-weight: 700;
            position: relative;
        }

        .case-btn .price {

            font-size: 13px;
            font-weight: 600;
            margin-top: 6px;

        }

            margin-top: 12px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;

            border-radius: 4px;
            background: linear-gradient(90deg, #f5a623, #f7c948);
            width: 0%;
            transition: width 0.8s ease;

            margin-bottom: 16px;

            height: 130px;
            overflow: hidden;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .roulette-items {
            display: flex;
            transition: transform 0.05s linear;
            height: 100%;
            align-items: center;
            will-change: transform;
            padding: 0 10px;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 4px;

        .roulette-item .rprice {

            left: 50%;
            width: 4px;

            transform: translateX(-50%);

            top: -20px;
            left: 50%;
            transform: translateX(-50%);

            font-size: 18px;

            ]
        }, {
            name: "🔪 Ножи",
            price: 3000,
            items: [
                { name: "Нож | Лесная сеть", quality: "restricted", value: 2200, weight: 14 },
                { name: "Нож | Степь", quality: "restricted", value: 2400, weight: 14 },
                { name: "Нож | Гексагон", quality: "restricted", value: 2600, weight: 14 },
                { name: "Нож | Гипербит", quality: "restricted", value: 2800, weight: 14 },
                { name: "Нож | Фараон", quality: "restricted", value: 3000, weight: 14 },
                { name: "Нож | Канна", quality: "classified", value: 7000, weight: 5 },
                { name: "★ Нож-бабочка | Степь", quality: "classified", value: 7500, weight: 5 },
                { name: "★ Карамбит | Гипербит", quality: "covert", value: 15000, weight: 1 },
                { name: "★ Нож-бабочка | Огонь и лёд", quality: "covert", value: 20000, weight: 1 },
                { name: "★ Карамбит | Тёмное море", quality: "covert", value: 25000, weight: 1 },
                { name: "★ Нож-бабочка | Ледяной", quality: "covert", value: 30000, weight: 1 },

            ]
        }, {
            name: "💎 Премиум",
            price: 5000,
            items: [
                { name: "★ Нож-бабочка | Степь", quality: "restricted", value: 2500, weight: 10 },
                { name: "★ Карамбит | Гипербит", quality: "restricted", value: 3000, weight: 10 },
                { name: "★ Нож-бабочка | Канна", quality: "restricted", value: 3500, weight: 10 },
                { name: "★ Карамбит | Фараон", quality: "restricted", value: 4000, weight: 10 },
                { name: "★ Нож-бабочка | Огонь и лёд", quality: "restricted", value: 4500, weight: 10 },
                { name: "★ Карамбит | Тёмное море", quality: "classified", value: 8000, weight: 5 },
                { name: "★ Нож-бабочка | Ледяной", quality: "classified", value: 9000, weight: 5 },
                { name: "★ Карамбит | Золотой дракон", quality: "covert", value: 15000, weight: 1 },
                { name: "★ Нож-бабочка | Император", quality: "covert", value: 20000, weight: 1 },
                { name: "★ Карамбит | Супер-легенда", quality: "covert", value: 25000, weight: 1 },
                { name: "★ Нож-бабочка | Космос", quality: "covert", value: 30000, weight: 1 },
                { name: "★ Карамбит | Бесконечность", quality: "covert", value: 35000, weight: 1 }
            ]
        }];

        // ===== ХРАНЕНИЕ =====
        const STORAGE_KEY = 'easy_skins_' + userId;
        let balance = 1000;
        let inventory = [];
        let isSpinning = false;
        let currentDroppedItem = null;

        // ===== СОХРАНЕНИЕ =====
        function saveData() {
            const data = { balance, inventory };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                if (tg.CloudStorage) {
                    tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                }
                document.getElementById('saveStatus').textContent = '✅ Сохранено';
            } catch (e) {}
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    balance = data.balance || 1000;
                    inventory = data.inventory || [];
                    updateUI();
                    return;
                }
            } catch (e) {}
            if (tg.CloudStorage) {
                tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
                    if (!err && value) {
                        try {
                            const data = JSON.parse(value);
                            balance = data.balance || 1000;
                            inventory = data.inventory || [];
                            updateUI();
                        } catch (e) {}
                    }
                });
            }
        }

        function updateUI() {
            document.getElementById('balance').textContent = balance;
            renderInventory();
        }

        // ===== НАВИГАЦИЯ =====
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + (page === 'cases' ? 'Cases' : 'Inventory')).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(page === 'cases' ? 'btnCases' : 'btnInv').classList.add('active');
            if (page === 'inventory') renderInventory();
        }

        // ===== КЕЙСЫ =====
        function renderCases() {
            const grid = document.getElementById('caseGrid');
            grid.innerHTML = '';
            cases.forEach((c, i) => {
                const btn = document.createElement('div');
                btn.className = 'case-btn';
                btn.innerHTML = `
                    <div class="name">${c.name}</div>
                    <div class="price">${c.price} 💰</div>
                    <div class="rarity"><div class="fill" style="width:${Math.random()*60+20}%"></div></div>
                `;
                btn.onclick = () => openCase(i);
                grid.appendChild(btn);
            });
      }
      
            balance -= caseData.price;
            updateUI();
            saveData();

            document.getElementById('caseGrid').style.display = 'none';
            document.getElementById('rouletteContainer').style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('rouletteResult').style.display = 'none';

            startRoulette(caseData.items);
        }

        // ===== КАРТИНКИ СКИНОВ (Steam) =====
        function getSkinImage(name) {
            const clean = name.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '%20');
            return `https://steamcommunity.com/market/listings/730/${encodeURIComponent(clean)}`;
        }

        // ===== РУЛЕТКА =====
        function startRoulette(itemsList) {
            isSpinning = true;

            // Выбираем предмет
            const totalWeight = itemsList.reduce((sum, i) => sum + i.weight, 0);
            let rand = Math.random() * totalWeight;
            let dropped = itemsList[0];
            for (let item of itemsList) {
                rand -= item.weight;
                if (rand <= 0) { dropped = item; break; }
            }
            currentDroppedItem = dropped;

            // Создаём список для прокрутки (50 предметов для плавности)
            const spinItems = [];
            for (let i = 0; i < 50; i++) {
                const r = itemsList[Math.floor(Math.random() * itemsList.length)];
                spinItems.push(r);
            }
            spinItems.push(dropped);

            const container = document.getElementById('rouletteItems');
            container.innerHTML = '';
            spinItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'roulette-item';
                div.innerHTML = `
                    <img src="${getSkinImage(item.name)}" alt="${item.name}" 
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2260%22%3E%3Crect width=%2280%22 height=%2260%22 fill=%22%231a1a2e%22/%3E%3Ctext x=%2240%22 y=%2235%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2224%22 font-family=%22Arial%22%3E${getIcon(item.quality)}%3C/text%3E%3C/svg%3E'">
                    <div class="rname">${item.name}</div>
                    <div class="rprice">${item.value}</div>
                `;
                container.appendChild(div);
            });

            // Анимация с точной остановкой
            const track = document.getElementById('rouletteTrack');
            const itemWidth = 150;
            const totalWidth = spinItems.length * itemWidth;
            // Выигрышный предмет должен оказаться строго под указателем
            const targetPosition = -(spinItems.length - 1) * itemWidth + (track.offsetWidth / 2) - (itemWidth / 2);

            let startTime = Date.now();
            const duration = 4000;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // easeOutQuint — очень плавное замедление
                const eased = 1 - Math.pow(1 - progress, 5);
                const pos = eased * targetPosition;
                container.style.transform = `translateX(${pos}px)`;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    showResult(dropped);
                }
            }
            animate();
        }

        function showResult(item) {
            const resultDiv = document.getElementById('rouletteResult');
            resultDiv.style.display = 'block';
            document.getElementById('rItem').innerHTML = `
                <img src="${getSkinImage(item.name)}" alt="${item.name}" 
                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2236%22%3E%3Crect width=%2248%22 height=%2236%22 fill=%22%231a1a2e%22/%3E%3Ctext x=%2224%22 y=%2222%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2220%22 font-family=%22Arial%22%3E${getIcon(item.quality)}%3C/text%3E%3C/svg%3E'">
                <span>${item.name}</span>
            `;
            document.getElementById('rQuality').textContent = item.quality.toUpperCase();
            document.getElementById('rQuality').style.color = getQualityColor(item.quality);
            document.getElementById('rValue').textContent = `💰 ${item.value} монет`;

            // Добавляем в инвентарь (БЕЗ автоматической продажи!)
            inventory.push({ ...item });
            updateUI();
            saveData();
            isSpinning = false;
        }

        function getIcon(quality) {
            const icons = {
                consumer: '⬜',
                industrial: '🟦',
                'mil-spec': '🟩',
                restricted: '🟪',
                classified: '🟥',
                covert: '⭐'
            };
            return icons[quality] || '⬜';
        }

        function getQualityColor(q) {
            const colors = {
                consumer: '#8a8a8a',
                industrial: '#5b8cdf',
                'mil-spec': '#4caf50',
                restricted: '#9b59b6',
                classified: '#e74c3c',
                covert: '#f1c40f'
            };
            return colors[q] || '#fff';
        }

        function backToCases() {
            if (isSpinning) return;
            document.getElementById('rouletteContainer').style.display = 'none';
            document.getElementById('rouletteResult').style.display = 'none';
            document.getElementById('caseGrid').style.display = 'grid';
            document.getElementById('backBtn').style.display = 'none';
        }

        // ===== ИНВЕНТАРЬ =====
        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            if (!inventory || inventory.length === 0) {
                grid.innerHTML = '<div class="inv-empty">🎒 Инвентарь пуст</div>';
                return;
            }
            grid.innerHTML = '';
            inventory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `inv-item quality-${item.quality}`;
                const sellPrice = Math.floor(item.value * 0.9);
                div.innerHTML = `
                    <img src="${getSkinImage(item.name)}" alt="${item.name}" 
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2260%22%3E%3Crect width=%2280%22 height=%2260%22 fill=%22%231a1a2e%22/%3E%3Ctext x=%2240%22 y=%2235%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2224%22 font-family=%22Arial%22%3E${getIcon(item.quality)}%3C/text%3E%3C/svg%3E'">
                    <div class="iname">${item.name}</div>
                    <div class="iprice">💰 ${item.value}</div>
                    <div class="iq" style="color:${getQualityColor(item.quality)}">${item.quality}</div>
                    <button class="sell-btn" onclick="sellItem(${index})">💰 Продать за ${sellPrice}</button>
                `;
                grid.appendChild(div);
            });
        }

        function sellItem(index) {
            const item = inventory[index];
            if (!item) return;
            const price = Math.floor(item.value * 0.9);

            if (tg.showPopup) {
                tg.showPopup({
                    title: '💸 Продажа',
                    message: `Продать "${item.name}" за ${price} монет?`,
                    buttons: [
                        { id: 'sell', text: '💰 Продать', type: 'default' },
                        { id: 'cancel', text: '❌ Отмена', type: 'destructive' }
                    ]
                }, (btnId) => {
                    if (btnId === 'sell') {
                        inventory.splice(index, 1);
                        balance += price;
                        updateUI();
                        saveData();
                        tg.showAlert(`✅ "${item.name}" продан за ${price} монет!`);
                    }
                });
            } else {
                if (confirm(`Продать "${item.name}" за ${price} монет?`)) {
                    inventory.splice(index, 1);
                    balance += price;
                    updateUI();
                    saveData();
                }
            }
        }

        // ===== ЗАПУСК =====
        renderCases();
        loadData();
        updateUI();
        setInterval(saveData, 60000);
    </script>
