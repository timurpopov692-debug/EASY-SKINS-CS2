<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY SKINS</title>
    <style>
        body {
            background: #0a0a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        h1 {
            color: #f5a623;
        }
        button {
            background: #f5a623;
            color: #0a0a1a;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <h1>🔫 EASY SKINS</h1>
    <p style="color:#888;">Если ты это видишь — всё работает!</p>
    <button onclick="alert('Привет!')">Нажми меня</button>
    <p style="color:#555;font-size:12px;margin-top:20px;">simple.html — тестовая страница</p>
</body>
</html>
